openapi: 3.1.0
info:
  title: NutriKids API
  description: "Desenvolvimento com dados sintéticos. Autenticação por sessão JSESSIONID\
    \ (HttpOnly), sem JWT. 1. GET /api/auth/csrf obtém cookie XSRF-TOKEN e token.\
    \ 2. POST /api/auth/login com email/senha e header X-XSRF-TOKEN. 3. Após login\
    \ obtenha novamente /csrf. Envie o token em POST, PUT, PATCH e logout. Swagger\
    \ usa cookies da mesma origem; não preencha JSESSIONID manualmente. Logout POST\
    \ /api/auth/logout invalida a sessão. 401: sessão ausente/inválida; 403: CSRF\
    \ ou perfil. A clínica vem da sessão. Responsáveis só acessam pacientes vinculados\
    \ e conteúdo compartilhado. Recursos inacessíveis retornam 404. Listagens: page\
    \ começa em zero, size de 1 a 100 (padrão 50); resposta permanece array. Nunca\
    \ inserir dados reais neste ambiente."
  version: 0.1.0
servers:
- url: http://localhost
  description: Generated server url
security:
- sessao: []
paths:
  /api/pacientes/{id}:
    get:
      tags:
      - paciente
      summary: Consultar paciente
      description: Clínica da sessão; responsável requer vínculo. 404 oculta recursos
        fora do escopo.
      operationId: obter
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PacienteVista"
        "400":
          description: Entrada inválida; não inclui valores rejeitados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroApi"
        "401":
          description: Sessão ausente/inválida ou credenciais incorretas.
        "403":
          description: Perfil sem permissão ou token CSRF ausente/inválido.
        "404":
          description: Recurso não encontrado no escopo autorizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroApi"
        "409":
          description: "Conflito de integridade, versão concorrente ou agenda."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroApi"
        "413":
          description: Upload excede limite de 5 MB por requisição.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroApi"
        "429":
          description: Limite de tentativas de login atingido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroApi"
      security:
      - sessao: []
    put:
      tags:
      - paciente
      summary: Atualizar paciente
      description: ADMIN ou NUTRICIONISTA; controle otimista de versão no banco.
      operationId: editar
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-XSRF-TOKEN
        in: header
        description: Token de /api/auth/csrf; renovar após login.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PacienteDados"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PacienteVista"
        "400":
          description: Entrada inválida; não inclui valores rejeitados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroApi"
        "401":
          description: Sessão ausente/inválida ou credenciais incorretas.
        "403":
          description: Perfil sem permissão ou token CSRF ausente/inválido.
        "404":
          description: Recurso não encontrado no escopo autorizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroApi"
        "409":
          description: "Conflito de integridade, versão concorrente ou agenda."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroApi"
        "413":
          description: Upload excede limite de 5 MB por requisição.
          content:
            application/json:
