components:
  schemas:
    PacienteDados:
      type: object
      description: Contrato Paciente Dados. Exemplos e identificadores exclusivamente
        sintéticos.
      properties:
        nome:
          type: string
          description: Campo nome do contrato PacienteDados.
          example: Pessoa Sintética
          maxLength: 150
          minLength: 0
        nascimento:
          type: string
          format: date
          description: Campo nascimento do contrato PacienteDados.
          example: 2020-01-01
        sexo:
          type: string
          description: Campo sexo do contrato PacienteDados.
          example: F
          pattern: F|M|NAO_INFORMADO
        observacoes:
          type: string
          description: Campo observacoes do contrato PacienteDados.
          example: Exemplo fictício para documentação
          maxLength: 4000
          minLength: 0
      required:
      - nascimento
      - nome
      - sexo
    PacienteVista:
      type: object
      description: Contrato Paciente Vista. Exemplos e identificadores exclusivamente
        sintéticos.
      properties:
        id:
          type: string
          format: uuid
          description: Campo id do contrato PacienteVista.
        nome:
          type: string
          description: Campo nome do contrato PacienteVista.
          example: Pessoa Sintética
        nascimento:
          type: string
          format: date
          description: Campo nascimento do contrato PacienteVista.
          example: 2020-01-01
        sexo:
          type: string
          description: Campo sexo do contrato PacienteVista.
          example: F
        observacoes:
          type: string
          description: Campo observacoes do contrato PacienteVista.
          example: Exemplo fictício para documentação
        versao:
          type: integer
          format: int64
          description: Campo versao do contrato PacienteVista.
    EquipeNome:
      type: object
      description: Contrato Equipe Nome. Exemplos e identificadores exclusivamente
        sintéticos.
      properties:
        nome:
          type: string
          description: Campo nome do contrato EquipeNome.
          example: Pessoa Sintética
          maxLength: 150
          minLength: 0
      required:
      - nome
    EquipeVistaClinica:
      type: object
      description: Contrato Equipe VistaClinica. Exemplos e identificadores exclusivamente
        sintéticos.
      properties:
        id:
          type: string
          format: uuid
          description: Campo id do contrato EquipeVistaClinica.
        nome:
          type: string
          description: Campo nome do contrato EquipeVistaClinica.
          example: Pessoa Sintética
    RegistroDados:
      type: object
      description: Contrato Registro Dados. Exemplos e identificadores exclusivamente
        sintéticos.
      properties:
        tipo:
          type: string
          description: Campo tipo do contrato RegistroDados.
          example: DIARIO_ALIMENTAR
          pattern: PRONTUARIO|ANAMNESE|PLANO_ALIMENTAR|DIARIO_ALIMENTAR|TERAPIA_ALIMENTAR|MENSAGEM|META
        conteudo:
          type: string
          description: Campo conteudo do contrato RegistroDados.
          example: Orientação exclusivamente sintética
          maxLength: 12000
          minLength: 0
        compartilhado:
          type: boolean
          description: Campo compartilhado do contrato RegistroDados.
      required:
      - conteudo
      - tipo
    RegistroVista:
      type: object
      description: Contrato Registro Vista. Exemplos e identificadores exclusivamente
        sintéticos.
      properties:
        id:
          type: string
          format: uuid
          description: Campo id do contrato RegistroVista.
        pacienteId:
          type: string
          format: uuid
          description: Campo pacienteId do contrato RegistroVista.
