name: NutriKids CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B verify
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm test && npm run build
        working-directory: frontend
  postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: PostgreSQL nativo descartável (sem Docker)
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE nutrikids_ci LOGIN PASSWORD 'synthetic-ci-only' CREATEDB;"
          sudo -u postgres createdb -O nutrikids_ci nutrikids_ci
      - run: mvn -B -Dtest=PostgresMigrationTest test
        env:
          TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/nutrikids_ci
          TEST_DB_USERNAME: nutrikids_ci
          TEST_DB_PASSWORD: synthetic-ci-only
      - name: Backup e restauração em banco separado
        env:
          PGPASSWORD: synthetic-ci-only
        run: |
          pg_dump -h 127.0.0.1 -U nutrikids_ci -Fc nutrikids_ci -f /tmp/nutrikids.dump
          createdb -h 127.0.0.1 -U nutrikids_ci nutrikids_restore
          pg_restore -h 127.0.0.1 -U nutrikids_ci --exit-on-error -d nutrikids_restore /tmp/nutrikids.dump
          psql -h 127.0.0.1 -U nutrikids_ci -d nutrikids_restore -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM flyway_schema_history WHERE success;"
